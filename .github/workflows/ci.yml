#
# Loran CI pipeline (Phase 0 scope: Linux x86_64 only).
#
# Steps: cargo fmt --check → cargo clippy -D warnings → cargo test
#      → cargo audit → cargo xtask check-spdx.
#
# Multi-platform Tier 1 (musl, aarch64, FreeBSD) and Tier 2 (macOS arm64)
# are intentionally deferred to a Phase 1+ cross-cutting WP. Tracked in
# loran-todo-v0_1.md LOR-P000-038/039/040.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: fmt + clippy + test + audit + spdx (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.88.0)
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast

      - name: cargo test --release (NFR thresholds enforced)
        # NFR-001 (`resolve_show` ≤ 50 ms) and NFR-002
        # (1k-page index build + list ≤ 100 ms) only enforce their
        # production-tight thresholds in release builds. Debug runs
        # use a 10× relaxation in the same test file.
        run: cargo test --release -p loran-core --test nfr

      - name: cargo bench --no-run (compile-check benchmarks)
        # We don't run benchmarks in CI — wall-clock numbers from a
        # GitHub-hosted runner are too noisy to gate on. Compile so
        # benchmark code doesn't bit-rot.
        run: cargo bench --no-run --workspace

      - name: cargo audit
        # Don't fail CI on advisories that have no fix available; record
        # them as warnings. Hard advisories (ones with patched versions
        # available) will surface as the audit binary's exit code.
        run: cargo audit --deny warnings

      - name: cargo xtask check-spdx
        run: cargo xtask check-spdx
