[workspace]
members = [
    "crates/loran-cli",
    "crates/loran-core",
    "crates/loran-index",
    "crates/loran-pages",
    "crates/loran-render",
    "crates/loran-tldr",
    "crates/loran-tui",
    "crates/loran-mcp",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
authors = ["Mohamed Hammad <Mohamed.Hammad@Steelbore.com>"]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Steelbore/Loran"
homepage = "https://Loran.Steelbore.com/"
readme = "README.md"

[workspace.dependencies]
# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling (Microsoft Pragmatic Rust Guidelines)
thiserror = "2"
anyhow = "1"

# Observability (per SFRS)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Time — ISO 8601 UTC with Z suffix everywhere (Steelbore Standard §12)
jiff = { version = "0.2", features = ["serde"] }

# CLI (per SFRS canonical)
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Markdown rendering (loran-render). CommonMark; no_std-friendly.
pulldown-cmark = { version = "0.13", default-features = false }

# Filesystem traversal for the MarkdownPagesIngestor (loran-index).
walkdir = "2"

# Fuzzy search (Phase 1 — loran-core resolution).
nucleo-matcher = "0.3"

# Subprocess control for the live --help capture engine (Phase 1D — loran-core).
which = "7"
wait-timeout = "0.2"

# TTY detection for the agent-env cascade (Phase 1B — loran-cli).
is-terminal = "0.4"

# Test-only deps (dev-dependencies in member crates).
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
# Allow some pedantic lints that are too noisy at the workspace bootstrap stage.
# Re-evaluate per crate as code lands.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Placeholder crates don't carry `keywords` / `categories` yet — re-enable
# this lint per crate once each crate is publication-ready.
cargo_common_metadata = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
