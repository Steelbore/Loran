[package]
name = "loran"
description = "Loran — the Spacecraft Software reference manual (CLI binary)."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["man", "help", "info", "tldr", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "loran"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
is-terminal = { workspace = true }
jiff = { workspace = true }
schemars = { workspace = true }
loran-core = { path = "../loran-core", version = "0.4.0" }
loran-index = { path = "../loran-index", version = "0.4.0" }
loran-mcp = { path = "../loran-mcp", version = "0.4.0" }
loran-pages = { path = "../loran-pages", version = "0.4.0" }
loran-render = { path = "../loran-render", version = "0.4.0" }
loran-tui = { path = "../loran-tui", version = "0.4.0" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
