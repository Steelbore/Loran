[package]
name = "loran-core"
description = "Loran — orchestration and resolution chains for show / find / search / help."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["man", "help", "info", "tldr", "agent"]
categories = ["development-tools", "api-bindings"]
include = [
    "src/**/*.rs",
    "build.rs",
    "benches/**/*.rs",
    "pages/**/*.md",
    "pages/categories.toml",
    "Cargo.toml",
]

[dependencies]
loran-pages = { path = "../loran-pages", version = "0.4.0" }
loran-index = { path = "../loran-index", version = "0.4.0" }
dirs = { workspace = true }
flate2 = { workspace = true }
jiff = { workspace = true }
minisign-verify = { workspace = true }
nucleo-matcher = { workspace = true }
postcard = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
wait-timeout = { workspace = true }
which = { workspace = true }
zip = { workspace = true }

[build-dependencies]
loran-pages = { path = "../loran-pages", version = "0.4.0" }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "resolution"
harness = false

[lints]
workspace = true
