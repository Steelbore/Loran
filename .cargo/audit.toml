#
# cargo-audit configuration for the Loran workspace.
#
# Format: https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example
#
# Every ignore entry must include `reason` + a remediation note so a
# future maintainer auditing the audit ignores knows why each one is
# present and when to remove it.

[advisories]
ignore = [
    # `atomic-polyfill` (deprecated 2023; functionally subsumed by
    # `portable-atomic`) reaches us transitively:
    #
    #   atomic-polyfill 1.0.3
    #   └── heapless 0.7.17
    #       └── postcard 1.1.3   (Steelbore-canonical binary cache format)
    #
    # Postcard pins heapless 0.7 in its 1.x line. The fix is upstream
    # (heapless 0.8 → portable-atomic) which postcard adopts when its
    # next major version lands. Until then, accepting the unmaintained-
    # warning is the only viable path — `postcard` is the SFRS-pinned
    # cache format and `atomic-polyfill` itself carries no known CVE.
    #
    # Re-check whenever `postcard` releases a 2.x or otherwise drops
    # the heapless 0.7 dep.
    "RUSTSEC-2023-0089",
]
informational_warnings = ["unmaintained"]
